# The gate, on every pull request and every push to `main`.
#
# This exists because `release.yml` triggers on a tag, and a tag can be pushed at
# any commit. Without a gate on the way in, the release workflow would be the
# first thing to ever run the tests on that code — and it would be running them
# to decide whether to publish a binary it had already built. The gate belongs
# where the code enters `main`, and the release re-runs it on the exact checkout
# it ships from.
#
# Both halves of the repository are gated: the TypeScript senses and the Rust
# panel. They are separate jobs so a red run names which half broke.
#
# A third job gates the *platform* rather than a half. The panel's transport is
# the one seam whose two sides are chosen at compile time, and the Windows side —
# a named pipe, a `File` client, a fresh connection per outgoing line — is
# unreachable on a Linux runner: the TypeScript pipe suite skips itself, and the
# Rust branches are behind `#[cfg(windows)]`, so `cargo test` never links them.
# Without that job the code that only Windows runs is gated by nothing at all.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A force-push or a quick second commit makes the earlier run's answer stale.
# Unlike the release workflow, cancelling here loses nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bun:
    name: bun
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Two passes, `src` then the suites. A test asserting against a type that
      # no longer exists is the failure this second pass was added to catch.
      - run: bun run typecheck

      # Offline by construction: no model runtime, no network, no secret. That is
      # what lets the whole suite gate a pull request from a fork.
      - run: bun test

      - run: bun run build

  ui:
    name: ui
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # femtovg links fontconfig and freetype; winit needs xkbcommon. Without
      # these headers the panel does not link on a clean runner.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev

      # Formatting is checked first because it needs no compilation, so a
      # whitespace-only mistake fails in seconds instead of after a full build.
      - run: cargo fmt --all -- --check

      # `--all-targets` reaches the test code too. The parser in `src/protocol.rs`
      # is hand-written against untrusted bytes and most of its assertions live in
      # `#[cfg(test)]`, so linting only the library would skip the code that
      # documents the parser's edges.
      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

  # One job for both halves, unlike the split above, because what is under test
  # here is a single seam rather than two independent trees: the TypeScript end
  # binds the pipe, the Rust end opens it, and a failure in either is a failure
  # of the same contract. The steps are named, so a red run still says which side
  # broke.
  windows:
    name: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # The whole suite, not just the pipe tests. A path assembled with
      # `node:path` behaves differently under a drive letter and a backslash
      # separator, and this is the only run that would notice.
      - run: bun test

      # No system headers: MSVC runners ship what Slint and winit link against.
      # No `cargo fmt` either — formatting is platform-independent and the Linux
      # job already answered it.
      #
      # Clippy matters more here than the shared lint suggests: every lint inside
      # a `#[cfg(windows)]` block is invisible to the Linux job, because the code
      # is never linked there to be linted.
      - name: Lint and test the panel
        working-directory: ui
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
