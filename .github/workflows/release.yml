# Publishes a pre-release from a tag, and only from artifacts the gate already
# passed on.
#
# Why a tag and not a branch push: a release names a commit forever, so the thing
# that triggers it should be the immutable pointer, not a moving one. Pushing
# `v0.1.0-alpha.1` is the decision to ship; nothing else in this file decides it.
#
# Why the gate runs here again rather than trusting a green CI run: this workflow
# builds the binary it uploads. If the gate lived only on the pull request, the
# release job could publish a binary built from code no test ever ran against —
# the tag could point anywhere. The gate and the build see the same checkout.
#
# The tag is also the only ledger for the version number: it must be `v` plus a
# semver, and that is where the version comes from — nowhere else. The manifests
# in the tree (`package.json`, `ui/Cargo.toml`) are not consulted and not
# trusted; the `version` job stamps the tag's number into them before any build
# runs, so the shipped panel cannot disagree with the tag that named it. The
# manifests in git are a convenience for local development, never the release's
# source of truth.
name: release

on:
  push:
    tags:
      # Semver matching either pre-releases (e.g. `v0.1.0-alpha.1`) or stable
      # releases (e.g. `v1.0.0`).
      - "v[0-9]+.[0-9]+.[0-9]+*"
  # A dry run that does everything except publish. Useful for proving the build
  # works on a clean runner without spending a tag on it.
  workflow_dispatch:

# The repository default is read-only, so a release needs this stated. It is
# stated once at the top and narrowed per job: only `publish` may write.
permissions:
  contents: read

# Two tags pushed close together would otherwise race to attach assets to
# releases that are not theirs. Releases are not cancelled in flight, though —
# a half-published release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Cargo strips colour when it does not see a TTY, and the Actions log renders
  # it. Keeping it on makes a clippy failure readable in the web view.
  CARGO_TERM_COLOR: always

jobs:
  # The TypeScript side: contracts, store, projection, resident agent. Offline by
  # construction — no model runtime, no network — which is why it can gate a
  # release without any secret.
  gate-bun:
    name: gate (bun)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned to the version in `package.json`'s `packageManager`. A gate
          # that ran on a different runtime than the one developers use would be
          # measuring a different program.
          bun-version: 1.4.2

      # `--frozen-lockfile` is the point of the step: a release must not resolve
      # a dependency the lockfile did not already name.
      - run: bun install --frozen-lockfile

      # Two passes: the build config, then the tests against the real source
      # types. See the comment in `tsconfig.tests.json` for why the second one
      # has to exist.
      - run: bun run typecheck

      - run: bun test

      - run: bun run build

  # The Rust side: the control panel binary. Split from `gate-bun` so a failure
  # names which half broke, and so the two run at once.
  gate-ui:
    name: gate (ui)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same cache as the pull-request gate — a release gate that recompiles the
      # whole tree from nothing on every tag buys no extra certainty over
      # `--locked` + the same `Cargo.lock` the PR cache was keyed on.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui

      # Slint's femtovg renderer links fontconfig and freetype, and winit needs
      # xkbcommon. A clean runner has none of the headers, so this is not
      # optional tidiness — the build does not link without it.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev

      # The same three checks `ci.yml` runs, in the same order. A release gate
      # that were weaker than the pull-request gate would mean the tag is held to
      # a lower standard than the commit it points at.
      - run: cargo fmt --all -- --check

      # `--locked` everywhere below refuses to update `Cargo.lock`, for the same
      # reason `--frozen-lockfile` does on the Bun side. The lockfile is tracked
      # precisely so the shipped binary builds from one dependency graph.
      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

  # The tag stamps the version into both manifests.
  #
  # The tag is the release's name, but the two manifests each carry a `version`
  # the shipped things read from: `ui/Cargo.toml` for the panel — and
  # `env!("CARGO_PKG_VERSION")` puts that one inside the binary itself — and
  # `package.json` for the TypeScript side. This job writes the tag's number
  # into all three places (the two manifests plus the `squid-ui` entry in
  # `Cargo.lock`, which `--locked` below requires to agree), so the binaries
  # built downstream are literally built from the tag's version, not from
  # whatever the developer's last commit happened to leave behind. No manual
  # bump-and-tag dance: tag the commit that should ship, and the version
  # follows the pointer.
  #
  # The stamped files travel to the build jobs as an artifact rather than being
  # re-derived there: one stamping implementation, and the Linux and Windows
  # builds provably see the same bytes. It is uploaded even on
  # `workflow_dispatch` (where there is no tag, so the files go through
  # unmodified) — a build job's download step would fail on a missing artifact
  # and silently end the dry run.
  #
  # Unconditional at the job level rather than skipped on `workflow_dispatch`:
  # a job that a build `needs` and then skips skips the build with it, which
  # would silently end the dry run. The step inside decides instead.
  version:
    name: version (the tag stamps the manifests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the tag's version into the manifests
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "no tag in play (${GITHUB_REF_TYPE} ${GITHUB_REF_NAME}); leaving the manifests untouched"
            exit 0
          fi

          # The manifests hold the bare semver, the tag holds the one users
          # type. The shape is asserted rather than trusted: a tag that is not
          # `v` + semver-with-prerelease would stamp a version no tool accepts.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) version="${tag#v}" ;;
            *) echo "::error::$tag is not v<semver>" >&2; exit 1 ;;
          esac

          # The package version, written with the tool that parses JSON properly.
          jq --arg v "$version" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          # The panel version: the `^version` at column zero, which is the
          # `[package]` entry — dependency lines carry their own versions but
          # none of them start a line, so the anchor is the whole disambiguation.
          sed -i "s/^version = \".*\"$/version = \"$version\"/" ui/Cargo.toml

          # The lock must agree or `cargo build --locked` refuses to run. In the
          # `squid-ui` block the `version` line directly follows the `name`
          # line, so anchoring on the name and stepping one line down reaches
          # exactly the entry that must move and nothing else.
          sed -i "/^name = \"squid-ui\"$/{n;s/^version = \".*\"$/version = \"$version\"/}" ui/Cargo.lock

          # Read back and assert. A stamp step that quietly did nothing would
          # otherwise surface much later as a binary carrying the wrong version.
          pkg="$(jq -r .version package.json)"
          ui="$(sed -n 's/^version = "\(.*\)"$/\1/p' ui/Cargo.toml | head -n 1)"
          lock="$(sed -n '/^name = "squid-ui"$/{n;s/^version = "\(.*\)"$/\1/p}' ui/Cargo.lock)"
          [ "$pkg" = "$version" ] && [ "$ui" = "$version" ] && [ "$lock" = "$version" ]
          echo "tag $tag stamped: package.json = ui/Cargo.toml = Cargo.lock = $version"

      - name: Upload the stamped manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stamped-manifests
          path: |
            package.json
            ui/Cargo.toml
            ui/Cargo.lock
          if-no-files-found: error
          retention-days: 7

  # Builds everything a target ships, from the same checkout the gate ran on.
  # Kept separate from the gates because a release build is a different profile
  # than the one the tests run under, and because this job's only output is the
  # thing that gets uploaded.
  #
  # One job per target rather than a matrix, and one *whole* artifact per job:
  # the release asset is a zip holding the brain (`squid`, the compiled watch
  # session) and the panel (`squid-ui`) side by side, because a double-clicked
  # brain looks for its panel next to itself. Building the two halves in
  # different jobs would split one asset's provenance across two runners for no
  # gain — the Bun compile needs no Slint headers, so folding it in here is
  # free. The two differ in more than the triplet — Linux needs the Slint/winit
  # headers installed, Windows ships everything MSVC links against — so the
  # honest shape is two explicit jobs whose names say what they build.
  build-linux:
    name: build (x86_64-linux)
    needs: [version, gate-bun, gate-ui]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version job stamped the tag's number into the manifests; this build
      # compiles from those bytes, not from whatever the tree carries. Both
      # halves of the zip and `Cargo.lock`'s consistency under `--locked` then
      # read one story: the tag's.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stamped-manifests
          path: stamped-manifests

      - name: Apply the stamped manifests
        run: |
          cp stamped-manifests/package.json package.json
          cp stamped-manifests/ui/Cargo.toml ui/Cargo.toml
          cp stamped-manifests/ui/Cargo.lock ui/Cargo.lock

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libxkbcommon-dev

      # The release profile compiles fresh (a different profile than the gate's),
      # but the dependency tree beneath it is unchanged — caching the release
      # build means a re-run or a dry run pays only the working tree again.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui
          key: linux-release

      # The release profile in `ui/Cargo.toml` strips and LTOs, so this is the
      # binary as users get it, not a debug build with the same name.
      - name: Build the control panel
        working-directory: ui
        run: cargo build --release --locked

      # The brain: the watch session compiled into a standalone executable. The
      # entry is the packaged one (`src/squid-app.ts`), not the CLI script —
      # this is the binary a double-click runs, first-run conversation included.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Compile the double-click binary
        run: bun build --compile src/squid-app.ts --target=bun-linux-x64 --outfile squid

      # A checksum computed on the runner that produced the zip, published next
      # to it. It does not prove provenance on its own, but it lets someone who
      # downloads the asset tell whether they got the bytes this job made.
      - name: Stage the release asset
        run: |
          set -euo pipefail
          mkdir -p staging artifacts
          install -m 0755 ui/target/release/squid-ui staging/squid-ui
          install -m 0755 squid staging/squid
          zip -j artifacts/squid-x86_64-unknown-linux-gnu.zip \
            staging/squid staging/squid-ui
          # The panel-first flow only works when both siblings travel together.
          # `zip` succeeding proves it made an archive, not that a glob or a
          # staging rename did not quietly leave one half out; inspect the exact
          # member names before publishing the checksum for these bytes.
          members="$(unzip -Z1 artifacts/squid-x86_64-unknown-linux-gnu.zip | sort)"
          expected="$(printf '%s\n' squid squid-ui)"
          test "$members" = "$expected"
          cd artifacts
          sha256sum squid-x86_64-unknown-linux-gnu.zip \
            > squid-x86_64-unknown-linux-gnu.zip.sha256
          cat squid-x86_64-unknown-linux-gnu.zip.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: squid-x86_64-unknown-linux-gnu
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # The Windows build exists because the panel's Rust transport carries a
  # `#[cfg(windows)]` named-pipe branch (`ui/src/transport.rs`) matching the
  # TypeScript side's `\\.\pipe\<name>` listen spelling. That branch is a
  # different shape, not just a different type — the outgoing half parks a path
  # and opens per line — so without this job it compiles for nobody and a
  # Windows-only break would surface months later in someone's local build
  # instead of here. No system headers are installed: MSVC runners ship
  # everything Slint/winit link against. Same whole-asset contract as the Linux
  # job: one zip, brain and panel together.
  build-windows:
    name: build (x86_64-windows)
    needs: [version, gate-bun, gate-ui]
    runs-on: windows-2025
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same stamped-manifests contract as the Linux job: the panel's version
      # (`CARGO_PKG_VERSION`) comes from the tag, via one artifact both build
      # jobs download. Paths are anchored to the workspace root because the
      # job's `working-directory` is `ui` and this step reaches across it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stamped-manifests
          path: stamped-manifests

      - name: Apply the stamped manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ws = $env:GITHUB_WORKSPACE
          Copy-Item "$ws\stamped-manifests\package.json" "$ws\package.json"
          Copy-Item "$ws\stamped-manifests\ui\Cargo.toml" "$ws\ui\Cargo.toml"
          Copy-Item "$ws\stamped-manifests\ui\Cargo.lock" "$ws\ui\Cargo.lock"

      # Same rationale as the Linux build job; `key` keeps this cache from
      # colliding with the CI job's Windows dev-profile cache (different target
      # triple profile on the same runner image).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ui
          key: windows-release

      - name: Build the control panel
        run: cargo build --release --locked

      # The brain, compiled natively on the same OS that ships it. The Bun steps
      # opt back out of the `ui` working-directory: the compile entry lives at
      # the repository root.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile

      - name: Compile the double-click binary
        working-directory: ${{ github.workspace }}
        run: bun build --compile src/squid-app.ts --target=bun-windows-x64 --outfile squid.exe

      # Same contract as the Linux staging step: the exact bytes this job made,
      # with a checksum published beside them. `sha256sum`'s `HASH  NAME` layout
      # is reproduced by hand so `sha256sum -c` works on either platform.
      #
      # Paths here are anchored to the workspace root, not the job's
      # working-directory: `upload-artifact` resolves its `path` against
      # `$GITHUB_WORKSPACE` and ignores `defaults.run.working-directory`, so a
      # staging step that wrote `ui/artifacts` while the upload read `artifacts`
      # would fail the run after a successful build — measured, on the first
      # attempt. Anchoring both to the workspace root removes the seam.
      - name: Stage the release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force `
            "$env:GITHUB_WORKSPACE\staging", "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          Copy-Item target\release\squid-ui.exe "$env:GITHUB_WORKSPACE\staging\squid-ui.exe"
          Copy-Item "$env:GITHUB_WORKSPACE\squid.exe" "$env:GITHUB_WORKSPACE\staging\squid.exe"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\staging\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\artifacts\squid-x86_64-pc-windows-msvc.zip"
          # Same assertion as Linux, in PowerShell's archive API. A successful
          # archive that contains only one sibling would publish a panel that
          # cannot start a brain (or a brain with no UI), so member names are a
          # release contract, not an incidental build detail.
          $zip = "$env:GITHUB_WORKSPACE\artifacts\squid-x86_64-pc-windows-msvc.zip"
          $members = [System.IO.Compression.ZipFile]::OpenRead($zip).Entries |
            ForEach-Object { $_.FullName } | Sort-Object
          $expected = @("squid-ui.exe", "squid.exe") | Sort-Object
          if (Compare-Object $members $expected) {
            throw "release zip must contain squid.exe and squid-ui.exe, exactly once each"
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  squid-x86_64-pc-windows-msvc.zip" | Set-Content -NoNewline "$zip.sha256"
          Get-Content "$zip.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: squid-x86_64-pc-windows-msvc
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # The only job that writes anything outside the run. It does not build, does
  # not test, and does not run on `workflow_dispatch` — so a dry run exercises
  # the whole pipeline with nothing published at the end.
  publish:
    name: publish release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      # Narrowed to this job: creating a release writes to the repository.
      contents: write
    steps:
      # No checkout. This job builds nothing and reads no file from the tree —
      # `gh` needs the tag name, the token, and the downloaded assets. Checking
      # the repository out again next to the one credential in this workflow that
      # can write releases would be attack surface bought for nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Inspect whether the tag carries a pre-release suffix (e.g. `v0.1.0-alpha.1` vs `v1.0.0`).
      - name: Inspect release type
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *-* ]]; then
            echo "Publishing pre-release for $tag"
          else
            echo "Publishing stable release for $tag"
          fi

      # Idempotent, and the reason the first alpha publish failed: `gh release
      # create` hard-fails when the tag already has a release, which is exactly
      # what a retried run after a partial publish walks into. Create only when
      # the tag has no release; otherwise reuse it. Uploading is a separate
      # step with `--clobber`, so a retried asset replaces its stale
      # counterpart instead of failing on the name.
      - name: Create or reuse the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `gh` ships on the runner, so publishing does not hand a third-party
          # action the token that can write releases to this repository. The
          # panel binary's own dependency list is argued the same way in
          # `ui/Cargo.toml`; the pipeline that signs its releases is not a
          # weaker link than the thing it ships.
          #
          # `--generate-notes` alone walks back to the previous release, which on
          # the first tag is nothing at all — so no start tag is passed rather
          # than an empty one, which `gh` would reject.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release for $TAG already exists; uploading into it"
          else
            EXTRA_ARGS=()
            if [[ "$TAG" == *-* ]]; then
              EXTRA_ARGS+=("--prerelease")
            else
              EXTRA_ARGS+=("--latest")
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              "${EXTRA_ARGS[@]}" \
              --generate-notes
          fi

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `download-artifact` with no `name` lands every artifact of the run,
          # `stamped-manifests` included. That artifact is build input, not a
          # release asset — and it contains `ui/` as a directory, which
          # `gh release upload` refuses to touch (`is a directory`, exit 1).
          # The glob is keyed to the build jobs' artifact names, so only the
          # two targets' zips and their checksums are handed to the release.
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            artifacts/squid-*/*
